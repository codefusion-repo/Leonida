name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.evidence.outputs.artifact-id }}
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"
      - name: Isolate NuGet caches
        shell: pwsh
        run: |
          "NUGET_PACKAGES=$env:RUNNER_TEMP/leonida-nuget-packages" >> $env:GITHUB_ENV
          "NUGET_HTTP_CACHE_PATH=$env:RUNNER_TEMP/leonida-nuget-http" >> $env:GITHUB_ENV
      - name: Verify supply-chain policy and initialize reviewed submodule
        shell: pwsh
        run: |
          python -I -B tests/test_artifact_integrity.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B tests/test_supply_chain.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B scripts/supply_chain.py prepare --sha $env:CANDIDATE_SHA
          exit $LASTEXITCODE
      - name: Audited NuGet restore and resolved SBOM
        shell: pwsh
        run: |
          python -I -B scripts/supply_chain.py audit --sha $env:CANDIDATE_SHA --output "$env:RUNNER_TEMP/supply-chain"
          exit $LASTEXITCODE
      - name: Retain failed-bootstrap diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unreviewed-nuget-diagnostics
          path: ${{ runner.temp }}/supply-chain-unreviewed/
          if-no-files-found: ignore
          retention-days: 7
      - name: Require reviewed versioned lockfiles
        shell: pwsh
        run: |
          python -I -B scripts/supply_chain.py require-locks --sha $env:CANDIDATE_SHA
          exit $LASTEXITCODE
      - name: Python tools compile
        run: python -I -m compileall -q make_game.py tools
      - name: make_game.py help
        run: python -I -B make_game.py --help
      - name: Build rpf9dump without another restore
        run: dotnet build tools/rpf9dump/rpf9dump.csproj -c Release --no-restore
      - name: No game data tracked
        shell: bash
        run: |
          bad=$(git ls-files | grep -iE '\.(rpf|ttpf|xvd|dxbc|fssm|spv|spvasm|dds|bk2|awc|exe|dll)$' || true)
          if [ -n "$bad" ]; then echo "Game or binary files tracked:"; echo "$bad"; exit 1; fi
      - name: Create and verify evidence manifest
        shell: pwsh
        run: |
          python -I -B scripts/artifact_integrity.py create --directory "$env:RUNNER_TEMP/supply-chain" --sha $env:CANDIDATE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B scripts/artifact_integrity.py verify --directory "$env:RUNNER_TEMP/supply-chain" --sha $env:CANDIDATE_SHA
          exit $LASTEXITCODE
      - name: Retain dependency evidence
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nuget-sbom-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supply-chain/
          if-no-files-found: error
          retention-days: 30
  verify_evidence:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.check.outputs.artifact_id }}
          path: ${{ runner.temp }}/reviewed-evidence
      - name: Verify downloaded evidence
        run: python3 -I -B scripts/artifact_integrity.py verify --directory "$RUNNER_TEMP/reviewed-evidence" --sha "$CANDIDATE_SHA"
  attest:
    if: github.event_name == 'push' && github.repository == 'codefusion-repo/Leonida' && github.ref == 'refs/heads/main' && github.ref_protected
    needs: [check, verify_evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.check.outputs.artifact_id }}
          path: ${{ runner.temp }}/reviewed-evidence
      - name: Verify exact evidence before signing
        run: python3 -I -B scripts/artifact_integrity.py verify --directory "$RUNNER_TEMP/reviewed-evidence" --sha "$CANDIDATE_SHA" --signing
      - name: Attest evidence manifest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: ${{ runner.temp }}/reviewed-evidence/manifest.json
