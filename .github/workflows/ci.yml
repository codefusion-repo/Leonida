name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_PACKAGES: ${{ runner.temp }}/leonida-nuget-packages
      NUGET_HTTP_CACHE_PATH: ${{ runner.temp }}/leonida-nuget-http
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"
      - name: Verify supply-chain policy and initialize reviewed submodule
        shell: pwsh
        run: |
          python -I -B tests/test_supply_chain.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B scripts/supply_chain.py prepare --sha $env:CANDIDATE_SHA
          exit $LASTEXITCODE
      - name: Audited NuGet restore and resolved SBOM
        shell: pwsh
        run: |
          python -I -B scripts/supply_chain.py audit --sha $env:CANDIDATE_SHA --output "$env:RUNNER_TEMP/supply-chain"
          exit $LASTEXITCODE
      - name: Retain dependency evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nuget-sbom-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/supply-chain/
          if-no-files-found: error
          retention-days: 30
      - name: Python tools compile
        run: python -I -m compileall -q make_game.py tools
      - name: make_game.py help
        run: python -I -B make_game.py --help
      - name: Build rpf9dump without another restore
        run: dotnet build tools/rpf9dump/rpf9dump.csproj -c Release --no-restore
      - name: No game data tracked
        shell: bash
        run: |
          bad=$(git ls-files | grep -iE '\.(rpf|ttpf|xvd|dxbc|fssm|spv|spvasm|dds|bk2|awc|exe|dll)$' || true)
          if [ -n "$bad" ]; then echo "Game or binary files tracked:"; echo "$bad"; exit 1; fi
