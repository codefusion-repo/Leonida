name: PE preflight security
on:
  push:
    paths:
      - 'runtime/**'
      - '.github/workflows/pe-preflight.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - '.github/workflows/pe-preflight.yml'
permissions:
  contents: read
jobs:
  sanitizers:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          submodules: false
      - name: Compile and test portable validator under ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          clang++ --version
          clang++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer runtime/test/pe_validation_test.cpp -o "$RUNNER_TEMP/pe_validation_test"
          ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 "$RUNNER_TEMP/pe_validation_test"
  windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          submodules: false
      - name: Compile runtime and run data-only tests (no runtime execution)
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:CANDIDATE_SHA) { throw "Candidate SHA mismatch" }
          cmake -S runtime -B "$env:RUNNER_TEMP/pe-build" -A x64 -DLEONIDA_PE_VALIDATION_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/pe-build" --config Release --target gta6rt pe_validation_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir "$env:RUNNER_TEMP/pe-build" -C Release --output-on-failure
          exit $LASTEXITCODE
