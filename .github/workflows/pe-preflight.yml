name: PE preflight security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Reject external fork PR before checkout
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          submodules: false
      - name: Compile and test portable validator under ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 -I -B runtime/test/memory_policy_test.py
          python3 -I -B tests/test_binary_security.py -v
          python3 -I -B tests/test_native_link_evidence.py -v
          clang++ --version
          clang++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer runtime/test/pe_validation_test.cpp -o "$RUNNER_TEMP/pe_validation_test"
          ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 "$RUNNER_TEMP/pe_validation_test"
          clang++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer runtime/test/pe_relocation_test.cpp -o "$RUNNER_TEMP/pe_relocation_test"
          ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 "$RUNNER_TEMP/pe_relocation_test"
          clang++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer runtime/test/pe_symbols_test.cpp -o "$RUNNER_TEMP/pe_symbols_test"
          ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 "$RUNNER_TEMP/pe_symbols_test"
          clang++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer runtime/test/dll_policy_test.cpp -o "$RUNNER_TEMP/dll_policy_test"
          ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 "$RUNNER_TEMP/dll_policy_test"
          clang++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer runtime/test/loader_limits_test.cpp -o "$RUNNER_TEMP/loader_limits_test"
          ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 "$RUNNER_TEMP/loader_limits_test"
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Reject external fork PR before checkout
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          submodules: false
      - name: Compile runtime and run data-only tests (no runtime execution)
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:CANDIDATE_SHA) { throw "Candidate SHA mismatch" }
          cmake -S runtime -B "$env:RUNNER_TEMP/pe-build" -A x64 -DLEONIDA_PE_VALIDATION_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:RUNNER_TEMP/pe-build" --config Release --target gta6rt pe_validation_test pe_relocation_test pe_symbols_test dll_policy_test loader_limits_test loader_lifecycle_test shim_registry_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B tests/test_binary_security.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B scripts/binary_security.py --binary "$env:RUNNER_TEMP/pe-build/Release/gta6rt.exe" --toolchain "$env:RUNNER_TEMP/pe-build/runtime-toolchain-Release.txt" --build cmake --sha $env:CANDIDATE_SHA --output "$env:RUNNER_TEMP/native-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/inspect_native_pe.ps1 -Binary "$env:RUNNER_TEMP/pe-build/Release/gta6rt.exe" -Build cmake -Evidence "$env:RUNNER_TEMP/native-evidence"
          ctest --test-dir "$env:RUNNER_TEMP/pe-build" -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B runtime/test/loader_lifecycle_test.py "$env:RUNNER_TEMP/pe-build/Release/loader_lifecycle_test.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B runtime/test/dll_dry_run_test.py "$env:RUNNER_TEMP/pe-build/Release/gta6rt.exe"
          exit $LASTEXITCODE
      - name: Build direct MSVC and verify diagnostic integration
        shell: pwsh
        run: |
          & ./scripts/build_runtime.ps1 -DirectMsvc -LinkEvidence
          python -I -B scripts/binary_security.py --binary runtime/build/gta6rt.exe --toolchain runtime/build/runtime-toolchain-direct.txt --build direct --sha $env:CANDIDATE_SHA --output "$env:RUNNER_TEMP/native-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/inspect_native_pe.ps1 -Binary runtime/build/gta6rt.exe -Build direct -Evidence "$env:RUNNER_TEMP/native-evidence"
          python -I -B tests/test_native_link_evidence.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B scripts/native_link_evidence.py --binary runtime/build/gta6rt.exe --stdout runtime/build/runtime-link.stdout.txt --stderr runtime/build/runtime-link.stderr.txt --map runtime/build/runtime-link.map --evidence "$env:RUNNER_TEMP/native-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B runtime/test/dll_dry_run_test.py runtime/build/gta6rt.exe
          exit $LASTEXITCODE
      - name: Verify actual PowerShell first-look wrapper
        shell: pwsh
        run: |
          python -I -B runtime/test/dll_wrapper_test.py
          exit $LASTEXITCODE

      - name: Retain approved native build evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-pe-evidence-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-evidence/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain unapproved native diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-pe-UNAPPROVED-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-evidence/*.json
          if-no-files-found: ignore
          retention-days: 7
